<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Family Platform — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    }
    .card {
      max-width: 380px;
      width: 100%;
      text-align: center;
      padding: 32px 24px;
      border-radius: 16px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }
    h1 { font-size: 20px; margin: 0 0 8px; color: #0f172a; }
    p { font-size: 14px; color: #475569; margin: 0 0 24px; line-height: 1.5; }
    button {
      min-height: 44px;
      min-width: 44px;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      background: #a31621;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <main class="card">
    <h1>You're offline</h1>
    <p>Family Platform could not connect to myfamilyplatform.com. Please check your internet connection and try again.</p>
    <button id="retryBtn" type="button" onclick="retryConnection()">Try again</button>
  </main>
  <script>
    function retryConnection() {
      const btn = document.getElementById('retryBtn');
      btn.disabled = true;
      btn.textContent = 'Connecting…';
      window.location.replace('https://myfamilyplatform.com');
    }
  </script>
</body>
</html>
