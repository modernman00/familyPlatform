<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Family Platform</title>
  <style>
    :root { --brand: #a31621; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    }
    .card {
      max-width: 360px;
      width: 100%;
      text-align: center;
      padding: 32px 24px;
      border-radius: 16px;
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto 16px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; color: #cbd5e1; margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Loading Family Platform</h1>
    <p>Connecting securely to myfamilyplatform.com…</p>
  </main>
  <script>
    (function () {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 8000);
      fetch('https://myfamilyplatform.com/privacy', { mode: 'no-cors', signal: controller.signal })
        .then(() => {
          clearTimeout(timer);
          window.location.replace('https://myfamilyplatform.com');
        })
        .catch(() => {
          clearTimeout(timer);
          window.location.replace('offline.html');
        });
    })();
  </script>
</body>
</html>
