<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline | Family Platform</title>
  <meta name="theme-color" content="#a31621">
  <link rel="icon" type="image/png" sizes="32x32" href="/public/img/favicon/favicon-32x32.png">
  <style>
    button, h1, p { font-family: inherit; }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: #fbefef;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a31621;
      box-shadow: 0 4px 12px rgba(163, 22, 33, 0.15);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.95rem;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #a31621;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(163, 22, 33, 0.25);
    }
    .retry-btn:hover {
      background: #8a1019;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(163, 22, 33, 0.35);
    }
    .retry-btn:active {
      transform: translateY(0);
    }
    .footer-text {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-wrapper">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <div class="status-badge">
      <span class="status-dot"></span>
      No Internet Connection
    </div>

    <h1>You are currently offline</h1>
    <p>We couldn't connect to FamilyPlatform. Any posts or drafts you created while offline are safely saved and will sync as soon as your connection returns.</p>

    <button class="retry-btn" onclick="retryConnection()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Retry Connection
    </button>

    <div style="margin-top: 14px;">
      <a href="/login?pwa_rescue=1" style="color: #a31621; font-size: 0.88rem; font-weight: 600; text-decoration: none;">
        Go to Sign In &rarr;
      </a>
    </div>

    <div class="footer-text">
      FamilyPlatform PWA &bull; Offline Resilience
    </div>
  </div>

  <script>
    // 1. Immediately signal all active Service Workers to update in the background
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) {
          regs[i].update().catch(function() {});
        }
      }).catch(function() {});
    }

    // 2. Active Retry Button Handler
    async function retryConnection() {
      var btn = document.querySelector('.retry-btn');
      var originalText = btn.innerHTML;
      btn.innerHTML = 'Connecting...';
      btn.disabled = true;

      // Clear all cache storages completely
      if ('caches' in window) {
        try {
          var keys = await caches.keys();
          for (var j = 0; j < keys.length; j++) {
            await caches.delete(keys[j]);
          }
        } catch (_) {}
      }

      // Check live server health
      try {
        var res = await fetch('/api/health?t=' + Date.now(), { method: 'GET', cache: 'no-store' });
        if (res.ok) {
          window.location.replace('/login?source=pwa_retry&t=' + Date.now());
          return;
        }
      } catch (_) {}

      // Fallback: If device is online, navigate directly with bypass token
      if (navigator.onLine) {
        window.location.replace('/login?source=pwa_retry&t=' + Date.now());
      } else {
        setTimeout(function() {
          btn.innerHTML = 'Still offline &bull; Tap to retry';
          btn.disabled = false;
        }, 1200);
      }
    }

    // 3. Automated background poll: checks /api/health every 2 seconds and auto-navigates
    var pollInterval = setInterval(async function() {
      try {
        var res = await fetch('/api/health?t=' + Date.now(), { method: 'GET', cache: 'no-store' });
        if (res.ok) {
          clearInterval(pollInterval);
          window.location.replace('/login?source=pwa_retry&t=' + Date.now());
        }
      } catch (_) {}
    }, 2000);

    // 4. Listen for device online event
    window.addEventListener('online', function() {
      window.location.replace('/login?source=pwa_retry&t=' + Date.now());
    });
  </script>
</body>
</html>
