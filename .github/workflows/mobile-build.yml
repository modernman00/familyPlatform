name: Mobile Store Build (Family Platform)

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

jobs:
  android:
    name: Build Android AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install mobile dependencies & sync
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
      - name: Build Android App Bundle (.aab)
        working-directory: mobile/android
        run: ./gradlew bundleRelease
      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: com.familyplatform.app-android-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab

  ios:
    name: Build iOS Archive
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile dependencies & sync
        working-directory: mobile
        run: |
          npm ci
          npx cap sync ios
      - name: Build unsigned iOS archive (connect signing secrets for App Store export)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO
      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: com.familyplatform.app-ios-xcarchive
          path: mobile/ios/App/build/App.xcarchive
