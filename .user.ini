; =============================================================================
; 🛡️ NCSC PHP Advisory ("php2shell" — CVE-2026-109618 & CVE-2026-109619) Shield
; Disables RFC1867 session upload progress pointer table at SAPI PHP_INI_PERDIR
; =============================================================================
session.upload_progress.enabled = 0
session.upload_progress.cleanup = 0
expose_php = 0
upload_max_filesize = 20M
post_max_size = 20M
fatal_error_backtraces = 0
memory_limit = 512M
