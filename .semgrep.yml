rules:
  # ==============================================================================
  # Portfolio Security — Semgrep SAST Configuration
  # Applies to: PartyPlatform, FamilyPlatform, ExecMindApp, LoanEasyFinance,
  #             iAccountApp, iDecide, TenantScore
  # Covers   : OWASP Top 10 (PHP), CWE-89, CWE-79, CWE-22, CWE-78, CWE-798
  # Run with : semgrep scan --config=.semgrep.yml --error app/ index.php
  # ==============================================================================

  # ── SQL INJECTION
  - id: sql-injection-direct-concat
    patterns:
      - pattern: $query = $STR . $VAR;
      - pattern-not: $stmt = $pdo->prepare($query);
    message: "SQL injection: string concatenation in query. Use prepared statements."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: CWE-89
      owasp: A03:2021

  # ── XSS
  - id: xss-echo-unescaped-get
    pattern: echo $_GET[...];
    message: "XSS: raw GET param echoed. Use htmlspecialchars($val, ENT_QUOTES, 'UTF-8')."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: CWE-79

  - id: xss-echo-unescaped-post
    pattern: echo $_POST[...];
    message: "XSS: raw POST param echoed. Use htmlspecialchars($val, ENT_QUOTES, 'UTF-8')."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: CWE-79

  # ── PATH TRAVERSAL
  - id: path-traversal-file-get-contents
    pattern: file_get_contents($_GET[...]);
    message: "Path traversal: user input in file_get_contents(). Use realpath() + basename()."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: CWE-22

  - id: path-traversal-include-get
    pattern: include($_GET[...]);
    message: "Remote file inclusion via GET. Never include user-controlled paths."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: CWE-22

  - id: path-traversal-include-post
    pattern: include($_POST[...]);
    message: "Remote file inclusion via POST. Never include user-controlled paths."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: CWE-22

  # ── COMMAND INJECTION
  - id: command-injection-exec-get
    pattern: exec($_GET[...]);
    message: "Command injection: never pass GET input to exec()."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: CWE-78

  - id: command-injection-shell-exec
    pattern: shell_exec($_GET[...]);
    message: "Command injection: never pass GET input to shell_exec()."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: CWE-78

  # ── INSECURE DESERIALIZATION
  - id: insecure-unserialize-get
    pattern: unserialize($_GET[...]);
    message: "Insecure deserialization of GET input. Use json_decode() instead."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: CWE-502

  - id: insecure-unserialize-post
    pattern: unserialize($_POST[...]);
    message: "Insecure deserialization of POST input. Use json_decode() instead."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: CWE-502

  # ── OPEN REDIRECT
  - id: open-redirect-get
    pattern: 'header("Location: " . $_GET[...])'
    message: "Open redirect via GET param in Location header. Validate against allowlist."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: CWE-601

  - id: open-redirect-post
    pattern: 'header("Location: " . $_POST[...])'
    message: "Open redirect via POST param in Location header. Validate against allowlist."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: CWE-601

  # ── WEAK HASHING
  - id: weak-password-hash-md5
    pattern: md5($password);
    message: "MD5 broken for passwords. Use password_hash($pw, PASSWORD_ARGON2ID)."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: CWE-916

  - id: weak-password-hash-sha1
    pattern: sha1($password);
    message: "SHA1 unsuitable for passwords. Use password_hash($pw, PASSWORD_ARGON2ID)."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: CWE-916

  # ── PASSWORD_DEFAULT UPGRADE
  - id: prefer-argon2id-over-password-default
    pattern: password_hash($pw, PASSWORD_DEFAULT, ...);
    message: "Prefer PASSWORD_ARGON2ID over PASSWORD_DEFAULT for explicit, stable hashing."
    languages: [php]
    severity: WARNING
    metadata:
      cwe: CWE-916
