<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KinshipTree.js — 6-Generation Dynasty & Multiple Partners (Divorced & Current)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg-dark: #070b14;
      --surface-glass: rgba(15, 23, 42, 0.75);
      --surface-glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-gold: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark); color: var(--text-main);
    }
    #appWrapper { display: flex; flex-direction: column; width: 100vw; height: 100vh; position: relative; }
    header {
      height: 56px; padding: 0 20px;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--surface-glass-border);
      display: flex; align-items: center; justify-content: space-between; z-index: 50;
    }
    .brand-title { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; }
    .badge-pill {
      background: rgba(99, 102, 241, 0.2); border: 1px solid #6366f1; color: #a5b4fc;
      font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    }
    .badge-divorce {
      background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5;
      font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .btn-action {
      background: var(--surface-glass); border: 1px solid var(--surface-glass-border);
      color: var(--text-main); padding: 7px 12px; border-radius: 8px; font-size: 0.8rem;
      font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .btn-action.btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; border: none; }
    #treeStage { position: relative; flex: 1; width: 100%; height: 100%; min-height: 0; overflow: hidden; }
    #tree { position: absolute; inset: 0; width: 100%; height: 100%; }
    .kinship-link { transition: opacity 0.25s ease, stroke 0.25s ease, stroke-width 0.25s ease; }
    .controls-dock {
      position: absolute; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px;
      background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(20px);
      border: 1px solid var(--surface-glass-border); border-radius: 16px; padding: 8px; z-index: 30;
    }
    .dock-btn {
      width: 42px; height: 42px; border-radius: 10px; border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.06); color: var(--text-main);
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer;
    }
    #legendCard {
      position: absolute; bottom: 24px; left: 24px; background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px); border: 1px solid var(--surface-glass-border);
      border-radius: 14px; padding: 12px 16px; z-index: 30; font-size: 0.8rem;
    }
    .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .legend-line { width: 28px; height: 3px; border-radius: 2px; }
  </style>
</head>
<body>
<div id="appWrapper">
  <header>
    <div class="brand-title">
      <i class="bi bi-diagram-3-fill text-warning"></i>
      <span>KinshipTree<span style="color:var(--accent-gold);">.js</span></span>
      <span class="badge-pill">6 Full Generations (Gen 0 to Gen 6)</span>
      <span class="badge-divorce">Multiple Partners: Married & Divorced</span>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-action" onclick="tree.center(\"g4_1\", 0.75)">
        <i class="bi bi-person-bounding-box text-info"></i> Center on Multi-Partner Father
      </button>
      <button type="button" class="btn-action btn-gold" onclick="tree.fit()">
        <i class="bi bi-aspect-ratio"></i> Fit All 6 Generations
      </button>
    </div>
  </header>

  <div id="treeStage">
    <div id="tree"></div>

    <div id="legendCard">
      <div style="font-weight:700; margin-bottom:8px; color:#f8fafc;">Genealogical Connection Legend:</div>
      <div class="legend-row">
        <div class="legend-line" style="background:#f43f5e; border-top: 2px dashed #f43f5e;"></div>
        <span>Current Marriage / Spouse (Ring Symbol)</span>
      </div>
      <div class="legend-row">
        <div class="legend-line" style="background:#94a3b8; border-top: 2px dashed #94a3b8;"></div>
        <span>Former Spouse / Divorced (<span style="color:#ef4444; font-weight:700;">//</span> Double Slash Symbol)</span>
      </div>
      <div class="legend-row">
        <div class="legend-line" style="background:#818cf8;"></div>
        <span>Bloodline Trunk, Bus & Child Drops</span>
      </div>
    </div>

    <div class="controls-dock">
      <button type="button" class="dock-btn" onclick="tree.fit()" title="Fit Tree"><i class="bi bi-aspect-ratio"></i></button>
      <button type="button" class="dock-btn" onclick="tree.zoom(1.25)" title="Zoom In"><i class="bi bi-plus-lg"></i></button>
      <button type="button" class="dock-btn" onclick="tree.zoom(0.8)" title="Zoom Out"><i class="bi bi-dash-lg"></i></button>
      <button type="button" class="dock-btn" onclick="tree.reset()" title="Reset"><i class="bi bi-arrow-counterclockwise"></i></button>
    </div>
  </div>
</div>

<script src="/public/js/vendor/kinshiptree.js?v=9.0"></script>
<script>
  const dynasty6GenNodes = [
    // Generation 0: Great-Great-Great-Grandparents
    { id: "g0_1", pids: ["g0_2"], name: "ADEWALE OLAOGUN I", gender: "male", title: "Great-Great-Great-Grandfather (Gen 0)", img: "/resources/images/profile/avatarM.png" },
    { id: "g0_2", pids: ["g0_1"], name: "ADETOKUNBO OLAOGUN", gender: "female", title: "Great-Great-Great-Grandmother (Gen 0)", img: "/resources/images/profile/avatarF.png" },

    // Generation 1: Great-Great-Grandparents
    { id: "g1_1", pids: ["g1_2"], fid: "g0_1", mid: "g0_2", name: "BABATUNDE OLAOGUN", gender: "male", title: "Great-Great-Grandfather (Gen 1)", img: "/resources/images/profile/avatarM.png" },
    { id: "g1_2", pids: ["g1_1"], name: "FOLASHADE OLAOGUN", gender: "female", title: "Great-Great-Grandmother (Gen 1)", img: "/resources/images/profile/avatarF.png" },

    // Generation 2: Great-Grandparents
    { id: "g2_1", pids: ["g2_2"], fid: "g1_1", mid: "g1_2", name: "OLUSEGUN OLAOGUN SR", gender: "male", title: "Great-Grandfather (Gen 2)", img: "/resources/images/profile/avatarM.png" },
    { id: "g2_2", pids: ["g2_1"], name: "MOJISOLA OLAOGUN", gender: "female", title: "Great-Grandmother (Gen 2)", img: "/resources/images/profile/avatarF.png" },

    // Generation 3: Grandparents
    { id: "g3_1", pids: ["g3_2"], fid: "g2_1", mid: "g2_2", name: "OLUYOMI OLAOGUN", gender: "male", title: "Grandfather (Gen 3)", img: "/resources/images/profile/avatarM.png" },
    { id: "g3_2", pids: ["g3_1"], name: "IYABO OLAOGUN", gender: "female", title: "Grandmother (Gen 3)", img: "/resources/images/profile/avatarF.png" },

    // Generation 4: Parents (Father with 2 partners: Former/Divorced Spouse & Current Spouse)
    { id: "g4_1", pids: ["g4_ex", "g4_cur"], fid: "g3_1", mid: "g3_2", name: "SEGUN OLAOGUN", gender: "male", title: "Father / Multi-Partner (Gen 4)", img: "/resources/images/profile/olutobs_13th.jpeg" },
    { id: "g4_ex", pids: ["g4_1"], name: "PATRICIA MONROE", gender: "female", title: "Former Spouse (Divorced)", is_current: 0, union_type: "divorced", img: "/resources/images/profile/avatarF.png" },
    { id: "g4_cur", pids: ["g4_1"], name: "BIMPE OLAOGUN", gender: "female", title: "Current Spouse", is_current: 1, img: "/resources/images/profile/avatarF.png" },

    // Generation 5: Children (Child from 1st marriage & Child from 2nd marriage)
    { id: "g5_1", pids: [], fid: "g4_1", mid: "g4_ex", name: "KEMI OLAOGUN", gender: "female", title: "Daughter (Marriage 1)", img: "/resources/images/profile/avatarF.png" },
    { id: "g5_2", pids: ["g5_sp"], fid: "g4_1", mid: "g4_cur", name: "OLUTOBI OLAOGUN", gender: "male", title: "Son (Marriage 2)", img: "/resources/images/profile/family.jpeg" },
    { id: "g5_sp", pids: ["g5_2"], name: "CHIAMAKA OLAOGUN", gender: "female", title: "Daughter-in-law", img: "/resources/images/profile/avatarF.png" },

    // Generation 6: Great-Grandchildren
    { id: "g6_1", pids: [], fid: "g5_2", mid: "g5_sp", name: "TIWALOLA OLAOGUN", gender: "female", title: "Great-Granddaughter (Gen 6)", img: "/resources/images/profile/avatarF.png" }
  ];

  const tree = new KinshipTree("tree", {
    nodes: dynasty6GenNodes,
    rootId: "g4_1",
    scaleInitial: "fit"
  });
</script>
</body>
</html>
